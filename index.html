<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#090b12">
<title>Unstable Cinema</title>
<style>
:root{color-scheme:dark;--bg:#090b12;--panel:#121622;--line:#252c3c;--muted:#929bad;--text:#f4f6fb;--accent:#9b8cff}
*{box-sizing:border-box}
body{margin:0;background:radial-gradient(ellipse at 50% -20%,#252044 0,transparent 55%),var(--bg);color:var(--text);font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;min-height:100vh}
main{width:min(100% - 28px,980px);margin:0 auto;padding:34px 0 50px}
header{display:flex;align-items:center;gap:13px;margin-bottom:27px}
.logo{width:43px;height:43px;border-radius:14px;background:linear-gradient(145deg,#b2a4ff,#6555c9);display:grid;place-items:center;color:#0b0b14;font-size:21px;font-weight:900;box-shadow:0 8px 30px #7865e344}
h1{font-size:21px;letter-spacing:-.5px;margin:0}
.subhead{color:var(--muted);font-size:13px;margin-top:2px}
.panel{background:color-mix(in srgb,var(--panel) 94%,transparent);border:1px solid var(--line);border-radius:20px;padding:18px;box-shadow:0 18px 60px #0003}
.pickers{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:16px}
.pick{display:flex;flex-direction:column;gap:8px;padding:15px;border:1px dashed #414960;border-radius:14px;background:#ffffff04;min-width:0}
.pick strong{font-size:14px}
.pick small{color:var(--muted);font-size:12px}
input[type=file]{width:100%;font-size:12px;color:var(--muted)}
input::file-selector-button{border:0;border-radius:8px;padding:9px 11px;background:#292e40;color:var(--text);font-weight:650;margin-right:8px}
.stage{position:relative;background:#000;border-radius:15px;overflow:hidden;aspect-ratio:16/9;display:grid;place-items:center}
video{width:100%;height:100%;object-fit:contain;background:#000}
.controls{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;padding-top:15px}
.status{color:var(--muted);font-size:12px;min-height:18px}
.tools{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
button,select{border:1px solid var(--line);border-radius:10px;background:#1b2030;color:var(--text);padding:9px 12px;font:inherit;font-size:13px}
button:active{transform:scale(.98)}
button:disabled{opacity:.4}
.setting{display:flex;align-items:center;gap:7px;color:var(--muted);font-size:12px}
select{padding:8px 9px}
.note{color:var(--muted);font-size:12px;margin:15px 2px 0}
.note b{color:#c9c2ff}
@media(max-width:600px){main{width:min(100% - 20px,980px);padding-top:22px}.pickers{grid-template-columns:1fr}.panel{padding:12px}.stage{aspect-ratio:16/10}}
:fullscreen .stage{border-radius:0;aspect-ratio:auto;height:100vh}
:fullscreen video{height:100vh}
</style>
</head>
<body>
<main>
<header><div class="logo">▶</div><div><h1>Unstable Cinema</h1><div class="subhead">Your video. Your subtitles. No uploads, no local copies.</div></div></header>
<section class="panel" id="player">
<div class="pickers">
<label class="pick"><strong>🎬 Choose your movie</strong><small>Select the downloaded video from Files</small><input id="videoFile" type="file" accept="video/*"></label>
<label class="pick"><strong>💬 Choose subtitles</strong><small>Select your synced .srt file</small><input id="subtitleFile" type="file" accept=".srt,.txt,application/x-subrip,text/plain"></label>
</div>
<div class="stage" id="stage">
<video id="video" controls playsinline preload="metadata"></video>
</div>
<div class="controls">
<div class="status" id="status" aria-live="polite">Waiting for your files…</div>
<div class="tools">
<label class="setting">Text size <select id="size"><option value="18">Small</option><option value="25" selected>Medium</option><option value="32">Large</option><option value="40">Huge</option></select></label>
<label class="setting">Speed <select id="speed"><option value=".5">0.5×</option><option value=".75">0.75×</option><option value="1" selected>1×</option><option value="1.25">1.25×</option><option value="1.5">1.5×</option><option value="1.75">1.75×</option><option value="2">2×</option></select></label>
<button id="fullscreen" type="button">⛶ Fullscreen</button>
</div>
</div>
<p class="note"><b>Privacy:</b> Files are played directly in your browser. Nothing is uploaded or copied into browser storage. Keep the original files in Files.</p>
</section>
</main>
<script>
const video=document.getElementById('video'), videoInput=document.getElementById('videoFile'), srtInput=document.getElementById('subtitleFile'), statusEl=document.getElementById('status'), stage=document.getElementById('stage');
let cues=[],videoUrl=null,subtitleUrl=null,subtitleTrack=null;
function setStatus(s){statusEl.textContent=s}
function parseTime(t){const m=t.trim().match(/^(\d{1,3}):(\d{2}):(\d{2})[,.](\d{1,3})$/);return m?Number(m[1])*3600+Number(m[2])*60+Number(m[3])+Number(m[4].padEnd(3,'0').slice(0,3))/1000:NaN}
function parseSrt(text){
 const normalized=text.replace(/^\uFEFF/,'').replace(/\r\n?/g,'\n').trim();
 const blocks=normalized.split(/\n\s*\n/);const parsed=[];
 for(const block of blocks){const lines=block.split('\n');const ti=lines.findIndex(x=>x.includes('-->'));if(ti<0)continue;const parts=lines[ti].split('-->');const start=parseTime(parts[0]);const end=parseTime(parts[1].trim().split(/\s+/)[0]);const body=lines.slice(ti+1).join('\n').trim();if(Number.isFinite(start)&&Number.isFinite(end)&&body)parsed.push({start,end,text:body.replace(/<[^>]*>/g,'')});}
 return parsed.sort((a,b)=>a.start-b.start);
}
function toVttTime(seconds){
 const ms=Math.round(seconds*1000),h=Math.floor(ms/3600000),m=Math.floor(ms%3600000/60000),s=Math.floor(ms%60000/1000),x=ms%1000;
 return String(h).padStart(2,'0')+':'+String(m).padStart(2,'0')+':'+String(s).padStart(2,'0')+'.'+String(x).padStart(3,'0');
}
function makeTwoLineCues(source){
 const paired=[];
 for(let i=0;i<source.length;i++){
  const current=source[i],next=source[i+1];
  const currentLine=current.text.replace(/\s*\n\s*/g,' ').trim();
  const nextLine=next?next.text.replace(/\s*\n\s*/g,' ').trim():'';
  const gap=next?next.start-current.end:Infinity;
  if(next&&gap<=1.25){
   paired.push({start:current.start,end:current.end,text:currentLine+'\n'+nextLine});
  }else{
   paired.push(current);
  }
 }
 return paired;
}
function installNativeSubtitles(){
 if(subtitleTrack){subtitleTrack.remove();subtitleTrack=null}
 if(subtitleUrl){URL.revokeObjectURL(subtitleUrl);subtitleUrl=null}
 if(!cues.length)return;
 const displayCues=makeTwoLineCues(cues);
 const vtt='WEBVTT\n\n'+displayCues.map(c=>toVttTime(c.start)+' --> '+toVttTime(c.end)+'\n'+c.text).join('\n\n');
 subtitleUrl=URL.createObjectURL(new Blob([vtt],{type:'text/vtt'}));
 subtitleTrack=document.createElement('track');subtitleTrack.kind='subtitles';subtitleTrack.label='English';subtitleTrack.srclang='en';subtitleTrack.default=true;subtitleTrack.src=subtitleUrl;
 video.appendChild(subtitleTrack);
 const showTrack=()=>{try{subtitleTrack.track.mode='showing'}catch(e){}};
 subtitleTrack.addEventListener('load',showTrack);showTrack();setTimeout(showTrack,250);
}
function attachVideo(file){
 if(videoUrl)URL.revokeObjectURL(videoUrl);
 videoUrl=URL.createObjectURL(file);video.pause();video.removeAttribute('src');video.src=videoUrl;video.preload='metadata';video.load();installNativeSubtitles();
}
videoInput.addEventListener('change',()=>{
 const file=videoInput.files&&videoInput.files[0];if(!file)return;
 attachVideo(file);
 setStatus('Video selected. Playing directly from Files; no browser copy is created.');
});
srtInput.addEventListener('change',async()=>{
 const file=srtInput.files&&srtInput.files[0];if(!file)return;
 try{
  cues=parseSrt(await file.text());installNativeSubtitles();
  setStatus(cues.length+' subtitle cues loaded. Nothing was saved to browser storage.');
 }catch(e){cues=[];installNativeSubtitles();setStatus('Could not read that subtitle file. Please choose the .srt again.')}
});
video.addEventListener('loadedmetadata',()=>{setStatus('Video loaded • '+Math.round(video.duration/60)+' min'+(cues.length?' • subtitles loaded':' • choose your subtitle file')+'.')});
video.addEventListener('error',()=>setStatus('This video format may not be supported by Safari. Try an MP4 encoded with H.264 video and AAC audio.'));
document.getElementById('size').addEventListener('change',e=>{let style=document.getElementById('cueStyle');if(!style){style=document.createElement('style');style.id='cueStyle';document.head.appendChild(style)}style.textContent='video::cue { font-size: '+e.target.value+'px; }'});
document.getElementById('speed').addEventListener('change',e=>video.playbackRate=Number(e.target.value));
document.getElementById('fullscreen').addEventListener('click',async()=>{
 try{if(document.fullscreenElement){await document.exitFullscreen()}else if(stage.requestFullscreen){await stage.requestFullscreen()}else if(video.webkitEnterFullscreen){video.webkitEnterFullscreen()}else{setStatus('Fullscreen is not available in this browser.');}}
 catch(e){if(video.webkitEnterFullscreen)video.webkitEnterFullscreen();else setStatus('Fullscreen could not be started.');}
});
document.addEventListener('fullscreenchange',()=>{document.getElementById('fullscreen').textContent=document.fullscreenElement?'⤢ Exit fullscreen':'⛶ Fullscreen'});
</script>
</body>
</html>
